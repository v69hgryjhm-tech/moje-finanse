name: Clear stale Pages deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clear-pages-stale.yml'

permissions:
  contents: read
  pages: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect stale deployment and request fresh Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          echo "Old deployment status:"
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages/deployments/baafeb35baf9e0562569017db332590ada12aacb"
          echo
          echo "Requesting a fresh Pages build from latest main..."
          code=$(curl -sS -o /tmp/pages-build.out -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages/builds")
          cat /tmp/pages-build.out || true
          echo "HTTP $code"
          if [ "$code" != "201" ] && [ "$code" != "202" ]; then
            exit 1
          fi
