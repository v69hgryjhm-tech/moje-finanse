name: App smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static integration test
        run: node tests/static-smoke.mjs
      - name: Company net VAT regression test
        run: node tests/company-net-vat.mjs

      - name: Debt balance regression test
        run: node tests/debt-balance.mjs

      - name: Tax forecast summary test
        run: node tests/tax-forecast-summary.mjs

      - name: Payroll PIT reconciliation test
        run: node tests/payroll-pit-reconciliation.mjs

      - name: Monthly payments and reduced instalments
        run: node tests/monthly-payments.mjs
